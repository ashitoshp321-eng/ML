{% extends "layouts/base.html" %}

{% block title %}Login - ML Testing Platform{% endblock %}
{% block page_header %}Access Platform{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5" style="min-height: 70vh;">
    <div class="card glass-card auth-card shadow-lg" data-aos="zoom-in" data-aos-duration="600">
        <div class="card-body p-4 p-sm-5">
            <!-- Brand Info -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary-light rounded-circle p-3 mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-lock fs-3" style="color: var(--primary);"></i>
                </div>
                <h3 class="font-heading fw-bold">Welcome Back</h3>
                <p class="text-muted small">Please sign in to manage, train, and test models</p>
            </div>
            
            <!-- Login Form -->
            <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background: transparent; border-color: var(--border-color); color: var(--color-text-muted);">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label small fw-bold mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text" style="background: transparent; border-color: var(--border-color); color: var(--color-text-muted);">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-glow w-100 py-2.5 font-heading mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                </button>
            </form>
            
            <div class="text-center mt-3">
                <span class="small text-muted">Don't have an account? </span>
                <a href="{{ url_for('register') }}" class="small fw-bold text-decoration-none" style="color: var(--primary);">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
